<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surat Cinta &mdash; Romantic Web Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient floating rose petals & sparkles canvas -->
  <canvas id="petalsCanvas" class="petals-canvas" aria-hidden="true"></canvas>

  <!-- Soft atmospheric background glow -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <!-- Subtle top brand -->
  <header class="top-bar">
    <div class="brand-tag" aria-hidden="true">
    </div>
  </header>

  <!-- Main Stage -->
  <main class="stage">
    <!-- VIEW 1: Closed Envelope with Heart Seal in the Middle -->
    <section
      id="envelopeView"
      class="envelope-view"
      aria-label="Surat tertutup dengan segel hati"
    >
      <div class="envelope-intro">
        <p class="eyebrow">dibuka yaa</p>
        <h1 class="hero-title">for you salsaa</h1>
      </div>

      <div class="envelope-wrapper">
        <button
          id="envelopeTrigger"
          class="envelope"
          type="button"
          aria-label="Buka surat cinta"
          aria-expanded="false"
        >
          <!-- Envelope shadow -->
          <span class="envelope-shadow" aria-hidden="true"></span>

          <!-- Back wall & inner romantic pattern -->
          <span class="envelope-back" aria-hidden="true"></span>

          <!-- Letter peeking out during opening animation -->
          <span class="envelope-letter-peek" aria-hidden="true">
            <span class="peek-ornament">&hearts;</span>
            <span class="peek-line peek-line--title"></span>
            <span class="peek-line"></span>
            <span class="peek-line peek-line--short"></span>
          </span>

          <!-- Pocket flaps (left, right, bottom) -->
          <span class="envelope-pocket" aria-hidden="true">
            <span class="pocket-flap pocket-left"></span>
            <span class="pocket-flap pocket-right"></span>
            <span class="pocket-flap pocket-bottom"></span>
            <svg class="flap-crease-shadow" viewBox="0 0 300 200" preserveAspectRatio="none">
              <polyline points="0,2 150,114 300,2" fill="none" stroke="rgba(118, 42, 60, 0.22)" stroke-width="7" />
            </svg>
          </span>

          <!-- Top triangular flap -->
          <span class="envelope-flap" aria-hidden="true">
            <span class="flap-front"></span>
            <span class="flap-back"></span>
          </span>

          <!-- Center Heart Wax Seal ("love ditengahnya") -->
          <span class="heart-seal" aria-hidden="true">
            <span class="seal-ripple"></span>
            <span class="seal-wax">
              <svg class="seal-heart-svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
              </svg>
            </span>
          </span>
        </button>

        <p id="tapHint" class="tap-hint">
          <span class="hint-dot" aria-hidden="true"></span>
          Ketuk surat atau tanda love untuk membaca
        </p>
      </div>
    </section>

    <!-- VIEW 2: Opened Romantic Written Note -->
    <section
      id="noteView"
      class="note-view is-hidden"
      aria-label="Isi catatan surat romantis"
      aria-hidden="true"
    >
      <article class="note-card">
        <!-- Corner botanical/gold flourishes -->
        <span class="corner-ornament corner-tl" aria-hidden="true"></span>
        <span class="corner-ornament corner-tr" aria-hidden="true"></span>
        <span class="corner-ornament corner-bl" aria-hidden="true"></span>
        <span class="corner-ornament corner-br" aria-hidden="true"></span>

        <!-- Wax stamp badge at top -->
        <div class="note-header">
          <div class="note-stamp" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
            </svg>
          </div>
          <div class="note-meta">
            <div class="note-pager" id="notePager" aria-label="Navigasi catatan">
              <button id="prevNoteBtn" class="pager-btn" type="button" aria-label="Catatan sebelumnya">&lsaquo;</button>
              <span id="noteCounter" class="note-counter">1 / 3</span>
              <button id="nextNoteBtn" class="pager-btn" type="button" aria-label="Catatan berikutnya">&rsaquo;</button>
            </div>
          </div>
        </div>

        <!-- Read Mode -->
        <div id="noteReadMode" class="note-body-wrap">
          <div id="noteContentDisplay" class="note-content"></div>
        </div>

        <!-- Edit / Create Note Mode -->
        <form id="noteEditMode" class="note-edit-form is-hidden" novalidate>
          <div class="form-row">
            <label for="noteContentInput" class="form-label">Isi Catatan</label>
            <textarea
              id="noteContentInput"
              class="form-textarea"
              rows="7"
              maxlength="2000"
              placeholder="Tuliskan catatanmu di sini..."
              required
            ></textarea>
          </div>
          <div class="edit-actions">
            <button id="cancelEditBtn" class="action-btn action-btn--ghost" type="button">Batal</button>
            <button id="deleteNoteBtn" class="action-btn action-btn--danger is-hidden" type="button">Hapus</button>
            <button class="action-btn action-btn--primary" type="submit">Simpan Notes</button>
          </div>
        </form>

        <!-- Note Footer Controls -->
        <footer id="noteActionsFooter" class="note-footer">
          <button id="closeEnvelopeBtn" class="action-btn action-btn--ghost" type="button">
            &larr; Tutup Surat
          </button>
          <div class="footer-right-actions">
          </div>
        </footer>
      </article>
    </section>
  </main>

  <!-- Floating notification toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
